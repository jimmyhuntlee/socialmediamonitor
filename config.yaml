# ─────────────────────────────────────────────
#  한국 바이럴 콘텐츠 모니터 설정
#  유튜브(무료) = 매일 / 인스타·틱톡·스레드(Apify 유료) = 매주 월요일
# ─────────────────────────────────────────────

min_likes: 1000          # 이 좋아요 수 이상만 리포트에 포함
lookback_days: 7         # 최근 7일 안에 올라온 콘텐츠
weekly_day: 0            # 주 1회 플랫폼 수집 요일 (0=월 1=화 ... 6=일, 한국시간)
korean_only: true        # 본문/제목에 한글이 있는 콘텐츠만

# Apify 비용 안전장치: 수집기 1회 실행당 최대 금액(달러)
# 주 1회 x 3개 수집기 x $0.40 = 한 달 최대 약 $5 (무료 크레딧 안)
# 주의: 월요일이 아닌 날 "모든 플랫폼 수집"으로 수동 실행하면 그만큼 추가 비용
apify_max_usd_per_run: 0.40

# ── 유튜브 (공식 API, 무료 · 매일) ──────────
# 나라별로: 인기 급상승 차트 200개(4유닛) + 최근 조회수순 검색(검색 1회 100유닛)
# 하루 사용량 약 1,100유닛 / 무료 한도 10,000유닛
youtube:
  enabled: true
  frequency: daily
  trending_pages: 4
  search_max_results: 50
  regions:
    - code: KR
      name: 한국
      language: ko
      search_queries: ["", "쇼츠", "뮤직비디오", "예능", "브이로그", "먹방"]
    - code: US
      name: 미국
      language: en
      search_queries: ["", "shorts", "music video"]
      # 제목·채널명·설명·태그에 아래 문자나 단어가 있으면 미국 목록에서 제외
      exclude_scripts: ["indic", "arabic"]     # 인도 계열 문자(힌디어 등), 아랍·우르두 문자
      exclude_keywords: ["indian", "india", "desi", "hindi", "bollywood", "haryanvi", "bhojpuri",
                         "punjabi", "tamil", "telugu", "malayalam", "kannada", "marathi", "bengali",
                         "gujarati", "urdu", "pakistani", "chhath", "diwali", "saas bahu", "tmkoc",
                         "t-series", "honey singh"]
    - code: HR
      name: 크로아티아
      language: hr
      search_queries: ["", "glazba"]
      min_likes: 300        # 작은 나라라 기준을 낮춤 (빼면 전체 기준 1,000 적용)

# ── X / 트위터 ───────────────────────────────
# Apify 무료 플랜에서는 이 수집기를 API로 쓸 수 없어 꺼 둠
# 켜려면: Apify 유료 플랜(월 $19) 또는 provider: official (X 공식 API, 주 100건 ≈ $0.5)
x:
  enabled: false
  frequency: weekly
  provider: apify
  apify_actor: "apidojo/tweet-scraper"
  max_items: 100
  official_query: "lang:ko -is:retweet -is:reply"

# ── 인스타그램 (Apify) ── 주 약 125건 ≈ $0.33
instagram:
  enabled: true
  frequency: weekly
  apify_actor: "apify/instagram-hashtag-scraper"
  hashtags: ["일상", "맛집", "패션", "릴스", "밈"]
  results_per_hashtag: 25

# ── 틱톡 (Apify) ── 주 약 125건 ≈ $0.2~0.4
tiktok:
  enabled: true
  frequency: weekly
  apify_actor: "clockworks/tiktok-scraper"
  hashtags: ["추천", "fyp한국", "일상", "챌린지", "밈"]
  results_per_hashtag: 25

# ── 스레드 (Apify) ── 주 약 90건 ≈ $0.25
threads:
  enabled: true
  frequency: weekly
  apify_actor: "futurizerush/meta-threads-scraper"
  keywords: ["ㅋㅋㅋ", "요즘", "진짜"]
  max_posts_per_keyword: 30

# ── 스레드 글감 후보 (reports/candidates.md) ──
# 여러 채널이 동시에 다루는 '작은' 주제를 뽑아 둠 → 스레드 글 스킬이 이 파일만 읽음
threads_candidates:
  region: KR              # 어느 나라 콘텐츠로 뽑을지 (KR / US / HR)
  min_channels: 3         # 최소 몇 개 채널이 다뤄야 후보인지
  max_channels: 10        # 이보다 많으면 '큰 주제'(C)로 분류 - 후보엔 남지만 우선순위 낮음
  max_clusters: 40
  big_topics: ["gta", "수능", "mma", "mama"]   # 이번 주 대형 이벤트 → '큰 주제'(C)로 분류 (빼지 않음, 수시로 바꾸기)
  stopwords: []           # 후보에서 빼고 싶은 단어 추가

# ── 알림 (선택) ──────────────────────────────
telegram:
  enabled: true          # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 가 없으면 자동 건너뜀
  top_n: 20
